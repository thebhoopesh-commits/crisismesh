name: crisismesh
description: CrisisMesh - Offline AI Disaster Response Assistant

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  camera: ^0.11.0+2
  intl: ^0.19.0
  flutter_gemma: ^1.4.1
  flutter_gemma_litertlm: ^1.3.1
  google_fonts: ^8.2.0
  flutter_map: ^8.3.1
  flutter_map_tile_caching: ^10.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  nearby_connections: ^4.3.0
  flutter_gemma_mediapipe: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
